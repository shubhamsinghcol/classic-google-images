<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classic Google Images settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1><img src="icon/32.png" width="32" height="32" alt=""> Classic Google Images</h1>
    <fieldset class="preview-layout">
      <legend>Preview layout</legend>
      <div class="orientation-options">
        <label class="layout-card">
          <input type="radio" name="layout" value="horizontal" aria-label="Horizontal">
          <span class="layout-card-face">
            <svg viewBox="0 0 76 58" aria-hidden="true" focusable="false">
              <rect class="mini-window" x="3" y="5" width="70" height="48" rx="5"/>
              <path class="mini-tiles" d="M10 13h16v10H10zM30 13h16v10H30zM50 13h16v10H50z"/>
              <path class="mini-panel" d="M4 29h68v18a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/>
              <rect class="mini-photo" x="26" y="33" width="24" height="15" rx="2"/>
            </svg>
            <span>Horizontal</span>
          </span>
        </label>
        <label class="layout-card">
          <input type="radio" name="layout" value="vertical" aria-label="Vertical">
          <span class="layout-card-face">
            <svg viewBox="0 0 76 58" aria-hidden="true" focusable="false">
              <rect class="mini-window" x="3" y="5" width="70" height="48" rx="5"/>
              <path class="mini-tiles" d="M10 13h11v13H10zM25 13h11v13H25zM10 30h11v15H10zM25 30h11v15H25z"/>
              <path class="mini-panel" d="M42 6h25a5 5 0 0 1 5 5v36a5 5 0 0 1-5 5H42z"/>
              <rect class="mini-photo" x="47" y="14" width="20" height="29" rx="2"/>
            </svg>
            <span>Vertical</span>
          </span>
        </label>
        <label class="layout-card">
          <input type="radio" name="layout" value="automatic" aria-label="Auto">
          <span class="layout-card-face">
            <svg viewBox="0 0 76 58" aria-hidden="true" focusable="false">
              <rect class="mini-panel" x="7" y="9" width="23" height="35" rx="4"/>
              <rect class="mini-photo" x="12" y="15" width="13" height="23" rx="2"/>
              <rect class="mini-panel" x="40" y="22" width="30" height="22" rx="4"/>
              <rect class="mini-photo" x="45" y="27" width="20" height="12" rx="2"/>
              <path class="mini-arrow" d="M35 12h21m-4-4 4 4-4 4M41 50H20m4-4-4 4 4 4"/>
            </svg>
            <span>Auto</span>
          </span>
        </label>
      </div>
      <p class="help orientation-help">Auto follows the image shape. Near-square images use your default below.</p>
    </fieldset>
    <fieldset>
      <legend>Default orientation</legend>
      <div class="layout-options">
        <label><input type="radio" name="default-layout" value="horizontal"><span>Horizontal</span></label>
        <label><input type="radio" name="default-layout" value="vertical"><span>Vertical</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Preview theme</legend>
      <div class="theme-options">
        <button class="swatch dark" type="button" data-theme="dark" title="Dark charcoal" aria-label="Dark charcoal theme"></button>
        <button class="swatch light" type="button" data-theme="light" title="White light" aria-label="White light theme"></button>
        <button class="swatch sepia" type="button" data-theme="sepia" title="Sepia" aria-label="Sepia theme"></button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Maximum image enlargement</legend>
      <p class="help">Images can still shrink to fit the preview. This limit only controls enlargement.</p>
      <div class="scale-options">
        <label><input type="radio" name="scale" value="0"><span>No upscaling</span></label>
        <label><input type="radio" name="scale" value="50"><span>50% larger (1.5×)</span></label>
        <label><input type="radio" name="scale" value="70"><span>70% larger (1.7×)</span></label>
        <label><input type="radio" name="scale" value="100"><span>100% larger (2×, default)</span></label>
        <label><input type="radio" name="scale" value="150"><span>150% larger (2.5×)</span></label>
        <label><input type="radio" name="scale" value="200"><span>200% larger (3×)</span></label>
        <label><input type="radio" name="scale" value="300"><span>300% larger (4×)</span></label>
        <label class="custom"><input type="radio" name="scale" value="custom"><span>Custom</span>
          <input id="custom-value" type="number" min="0" max="1000" step="1" aria-label="Custom maximum enlargement percentage">
          <span>%</span>
        </label>
      </div>
    </fieldset>
    <p id="status" aria-live="polite"></p>
    <footer><a href="https://github.com/shubhamsinghcol/classic-google-images" target="_blank" rel="noopener noreferrer">GitHub</a><br>© Shubham Singh 2026</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
